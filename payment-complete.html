<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0a"><title>Order Status | BEN SARK DATA HUB</title><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><div class="logo">BEN SARK <span>DATA HUB</span></div></header><main class="result"><div class="result-card"><div id="icon" class="result-icon">…</div><h1 id="heading">Checking your order</h1><p id="message">Please wait while we verify your payment and data delivery.</p><div id="details"></div><a class="buy" href="/">BUY ANOTHER BUNDLE</a></div></main><script>
const ref=new URLSearchParams(location.search).get('reference');
async function run(){if(!ref){document.querySelector('#heading').textContent='Order reference missing';document.querySelector('#message').textContent='Please return to the store and try again.';return;} try{const r=await fetch('/api/transactions/'+encodeURIComponent(ref));const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not verify order.');const sent=d.status==='SUCCESS'&&d.data_transfer_status==='SENT';document.querySelector('#icon').textContent=sent?'✓':d.status==='FAILED'?'!':'…';document.querySelector('#heading').textContent=sent?'Data sent successfully!':d.status==='FAILED'?'Payment failed':'Order processing';document.querySelector('#message').textContent=sent?'Your bundle has been delivered to the beneficiary number.':d.status==='FAILED'?'The payment did not complete. Please try again.':'Payment is still being processed. Refresh this page shortly.';document.querySelector('#details').innerHTML='<div class="result-details"><span>Reference</span><b>'+d.transaction_ref+'</b></div><div class="result-details"><span>Network</span><b>'+d.network+'</b></div><div class="result-details"><span>Bundle</span><b>'+d.package_code+'</b></div>';}catch(e){document.querySelector('#icon').textContent='!';document.querySelector('#heading').textContent='Unable to verify';document.querySelector('#message').textContent=e.message;}}run();
</script></body></html>
